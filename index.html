
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>第七組｜漂浮性水生植物 AR 教學</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: "Microsoft JhengHei", sans-serif;
      background: #e9f7f1;
    }

    #header {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 430px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.94);
      text-align: center;
      z-index: 1000;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    h2 {
      margin: 0 0 5px;
      color: #18794e;
      font-size: 19px;
    }

    #header p {
      margin: 0;
      font-size: 13px;
      color: #555;
    }

    #status {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      max-width: 430px;
      padding: 13px 18px;
      border-radius: 14px;
      background: rgba(0,0,0,0.78);
      color: white;
      font-size: 14px;
      text-align: center;
      z-index: 1000;
    }

    #debug {
      position: fixed;
      top: 95px;
      left: 10px;
      right: 10px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.88);
      color: #333;
      font-size: 12px;
      z-index: 1000;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="header">
    <h2>🌿 水上漂流記</h2>
    <p>第七組｜探索漂浮性水生植物</p>
  </div>

  <div id="debug">
    模型狀態：等待載入
  </div>

  <div id="status">
    正在啟動 AR，請允許相機權限
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets timeout="60000">
      <a-asset-item
        id="waterplant"
        src="./W8_水生植物3D模型.glb">
      </a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity light="type: ambient; intensity: 1.8">
    </a-entity>

    <a-entity
      light="type: directional; intensity: 2"
      position="1 3 2">
    </a-entity>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">

      <a-entity id="modelWrapper">

        <a-gltf-model
          id="plantModel"
          src="#waterplant"
          position="0 0 0"
          rotation="0 0 0"
          scale="1 1 1">
        </a-gltf-model>

      </a-entity>

    </a-entity>

  </a-scene>

  <script>
    const statusText =
      document.getElementById("status");

    const debugText =
      document.getElementById("debug");

    const scene =
      document.querySelector("a-scene");

    const target =
      document.getElementById("target");

    const plantModel =
      document.getElementById("plantModel");

    const modelWrapper =
      document.getElementById("modelWrapper");

    let modelReady = false;
    let targetVisible = false;

    function updateStatus() {
      if (modelReady && targetVisible) {
        statusText.textContent =
          "辨識成功！請觀察浮萍的葉與根";
      } else if (modelReady) {
        statusText.textContent =
          "模型已載入，請掃描浮萍圖卡";
      } else if (targetVisible) {
        statusText.textContent =
          "辨識成功，正在等待模型載入";
      }
    }

    scene.addEventListener("arReady", () => {
      updateStatus();

      if (!modelReady) {
        statusText.textContent =
          "AR 已啟動，正在載入 3D 模型";
      }
    });

    scene.addEventListener("arError", () => {
      statusText.textContent =
        "AR 啟動失敗，請檢查相機或 targets.mind";
    });

    target.addEventListener("targetFound", () => {
      targetVisible = true;
      updateStatus();
    });

    target.addEventListener("targetLost", () => {
      targetVisible = false;
      updateStatus();
    });

    plantModel.addEventListener("model-loaded", () => {
      const mesh = plantModel.getObject3D("mesh");

      if (!mesh) {
        debugText.textContent =
          "模型事件已觸發，但找不到 3D 網格";
        return;
      }

      mesh.updateMatrixWorld(true);

      const box = new THREE.Box3().setFromObject(mesh);

      if (box.isEmpty()) {
        debugText.textContent =
          "模型邊界為空，請檢查 GLB";
        return;
      }

      const size = new THREE.Vector3();
      const center = new THREE.Vector3();

      box.getSize(size);
      box.getCenter(center);

      const maxDimension = Math.max(
        size.x, size.y, size.z
      );

      if (!Number.isFinite(maxDimension) ||
          maxDimension <= 0) {
        debugText.textContent =
          "模型尺寸無效";
        return;
      }

      // 將模型最長邊調整為 0.8 AR 單位
      const scaleFactor = 0.8 / maxDimension;

      // 使用外層容器縮放，
      // 避免覆蓋模型原本的比例
      modelWrapper.object3D.scale.setScalar(
        scaleFactor
      );

      // 將模型中心移動到辨識圖卡中心
      modelWrapper.object3D.position.set(
        -center.x * scaleFactor,
        -center.y * scaleFactor,
        -center.z * scaleFactor
      );

      modelReady = true;

      debugText.textContent =
        "模型載入成功｜尺寸：" +
        size.x.toFixed(2) + " × " +
        size.y.toFixed(2) + " × " +
        size.z.toFixed(2) +
        "｜縮放：" +
        scaleFactor.toFixed(4);

      console.log("模型載入成功", {
        size: size,
        center: center,
        scale: scaleFactor
      });

      updateStatus();
    });

    plantModel.addEventListener("model-error", (event) => {
      debugText.textContent =
        "模型載入失敗，請檢查 GLB";

      statusText.textContent =
        "3D 模型載入失敗";

      console.error(
        "GLB 載入錯誤：",
        event.detail
      );
    });

    document.getElementById("waterplant")
      .addEventListener("error", () => {
        debugText.textContent =
          "GLB 資源下載失敗";
      });

  </script>

</body>
</html>
