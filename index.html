
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
             maximum-scale=1.0, user-scalable=no"
  >

  <title>水上漂流記｜第七組浮萍 AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #102e25;
      font-family: "Microsoft JhengHei",
                   "Noto Sans TC", sans-serif;
    }

    #header {
      position: fixed;
      z-index: 1000;
      top: 12px;
      left: 5%;
      width: 90%;
      padding: 13px;
      text-align: center;
      background: rgba(255,255,255,0.94);
      border-radius: 16px;
      pointer-events: none;
    }

    #header h2 {
      margin: 0;
      color: #18794e;
      font-size: 23px;
    }

    #header p {
      margin: 6px 0 0;
      color: #52645b;
      font-size: 13px;
    }

    #debug {
      position: fixed;
      z-index: 1000;
      top: 110px;
      left: 5%;
      width: 90%;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.94);
      color: #194c36;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      pointer-events: none;
    }

    #status {
      position: fixed;
      z-index: 1000;
      bottom: 25px;
      left: 5%;
      width: 90%;
      padding: 14px;
      border-radius: 14px;
      background: rgba(0,0,0,0.84);
      color: white;
      font-size: 15px;
      line-height: 1.6;
      text-align: center;
      pointer-events: none;
    }

    #retry {
      position: fixed;
      z-index: 1100;
      right: 15px;
      bottom: 110px;
      padding: 10px 14px;
      background: #fff;
      color: #176c46;
      border: none;
      border-radius: 12px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div id="header">
    <h2>🌿 水上漂流記</h2>
    <p>第七組｜漂浮性水生植物：浮萍</p>
  </div>

  <div id="debug">
    正在準備 AR 系統……
  </div>

  <div id="status">
    請允許使用相機
  </div>

  <button
    id="retry"
    onclick="location.reload()"
  >
    重新載入
  </button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;
                  autoStart: true;
                  uiLoading: yes;
                  uiScanning: no;
                  uiError: yes;"
    embedded
    renderer="colorManagement: true;
              antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      light="type: ambient;
             color: #ffffff;
             intensity: 1.5">
    </a-entity>

    <a-entity
      light="type: directional;
             color: #ffffff;
             intensity: 2"
      position="1 2 3">
    </a-entity>

    <!-- 辨識圖卡 -->
    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">

      <!-- 浮萍模型 -->
      <a-entity
        id="plant"
        position="0 0 0"
        rotation="90 0 0"
        visible="false">
      </a-entity>

    </a-entity>

  </a-scene>

  <script>
    // ===================================
    // 第七組浮萍 AR
    // GitHub 實際模型檔名
    // ===================================

    const MODEL_URL = "./duckweed-ar.glb";
    const TARGET_URL = "./targets.mind";

    const scene = document.querySelector("a-scene");
    const target = document.getElementById("target");
    const plant = document.getElementById("plant");

    const debug = document.getElementById("debug");
    const status = document.getElementById("status");

    let modelReady = false;
    let tracking = false;
    let arReady = false;
    let loading = false;

    function message(text) {
      debug.textContent = text;
      console.log("[浮萍 AR]", text);
    }

    function showError(text) {
      message("❌ " + text);
      status.textContent = "請查看上方錯誤訊息";
    }

    function updateStatus() {
      if (tracking && modelReady) {
        status.textContent =
          "🌿 辨識成功！觀察浮萍的葉狀體與細根";
      } else if (tracking) {
        status.textContent =
          "已辨識圖卡，等待 3D 模型";
      } else if (modelReady) {
        status.textContent =
          "模型已準備好，請對準浮萍 AR 圖卡";
      } else if (arReady) {
        status.textContent =
          "相機已啟動，正在準備 3D 模型";
      }
    }

    // 檢查 GitHub 上的模型檔案
    async function checkFile(url) {
      const response = await fetch(
        url,
        { cache: "no-store" }
      );

      if (!response.ok) {
        throw new Error(
          "模型網址 HTTP " + response.status
        );
      }

      const buffer = await response.arrayBuffer();

      if (buffer.byteLength < 20) {
        throw new Error("模型檔案內容過小");
      }

      const view = new DataView(buffer);

      // GLB 的前四個位元組必須是 glTF
      const magic = view.getUint32(0, true);

      if (magic !== 0x46546C67) {
        throw new Error(
          "下載的內容不是有效的 GLB 檔案開頭"
        );
      }

      const version = view.getUint32(4, true);

      if (version !== 2) {
        throw new Error(
          "GLB 版本不是 2"
        );
      }

      const declaredLength =
        view.getUint32(8, true);

      if (declaredLength !== buffer.byteLength) {
        throw new Error(
          "GLB 檔案長度不一致"
        );
      }

      return buffer.byteLength;
    }

    // 真正載入模型
    async function loadModel() {
      if (loading || modelReady) return;
      loading = true;

      try {
        message("正在檢查 GLB 檔案……");

        const bytes = await checkFile(MODEL_URL);

        message(
          "✅ GLB 下載成功：" +
          (bytes / 1024 / 1024).toFixed(2) +
          " MB，正在解析 3D 模型……"
        );

        // 使用 A-Frame 的 GLTFLoader
        const loader = new THREE.GLTFLoader();

        loader.load(
          MODEL_URL,

          function (gltf) {
            try {
              const object = gltf.scene;

              if (!object) {
                throw new Error("GLB 沒有場景");
              }

              object.updateMatrixWorld(true);

              const box = new THREE.Box3()
                .setFromObject(object);

              if (box.isEmpty()) {
                throw new Error("模型沒有可見幾何");
              }

              const size = new THREE.Vector3();
              const center = new THREE.Vector3();

              box.getSize(size);
              box.getCenter(center);

              const longest = Math.max(
                size.x, size.y, size.z
              );

              if (
                !Number.isFinite(longest) ||
                longest <= 0
              ) {
                throw new Error("模型尺寸異常");
              }

              // 自動縮放模型
              const factor = 0.75 / longest;

              object.position.sub(center);
              object.scale.setScalar(factor);

              plant.object3D.add(object);
              plant.object3D.visible = true;

              modelReady = true;

              message(
                "✅ 3D 模型載入成功！" +
                "｜原始尺寸：" +
                size.x.toFixed(2) + " × " +
                size.y.toFixed(2) + " × " +
                size.z.toFixed(2)
              );

              updateStatus();

            } catch (error) {
              showError(
                "模型處理錯誤：" + error.message
              );
            }
          },

          undefined,

          function (error) {
            const detail =
              error && error.message
                ? error.message
                : String(error);

            showError(
              "3D 模型解析失敗：" + detail
            );
          }
        );

      } catch (error) {
        showError(error.message);
      }
    }

    // 等待 A-Frame 初始化
    if (scene.hasLoaded) {
      loadModel();
    } else {
      scene.addEventListener(
        "loaded",
        loadModel,
        { once: true }
      );
    }

    // AR 相機啟動
    scene.addEventListener("arReady", () => {
      arReady = true;
      updateStatus();
    });

    scene.addEventListener("arError", () => {
      showError(
        "AR 相機或辨識檔啟動失敗"
      );
    });

    // 辨識成功
    target.addEventListener(
      "targetFound",
      () => {
        tracking = true;
        updateStatus();
      }
    );

    // 辨識離開
    target.addEventListener(
      "targetLost",
      () => {
        tracking = false;
        updateStatus();
      }
    );

  </script>

</body>
</html>
