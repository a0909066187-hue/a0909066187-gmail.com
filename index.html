
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no">

  <title>水上漂流記｜第七組浮萍 AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: #102b23;
      font-family: "Microsoft JhengHei",
                   "Noto Sans TC", sans-serif;
    }

    #header {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 460px;
      padding: 13px;
      background: rgba(255,255,255,.94);
      border-radius: 16px;
      text-align: center;
      z-index: 1000;
      pointer-events: none;
    }

    #header h2 {
      margin: 0 0 5px;
      color: #147b4c;
      font-size: 22px;
    }

    #header p {
      margin: 0;
      color: #53655b;
      font-size: 13px;
    }

    #debug {
      position: fixed;
      top: 115px;
      left: 4%;
      width: 92%;
      padding: 10px 12px;
      background: rgba(255,255,255,.94);
      border-radius: 12px;
      color: #194e37;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      z-index: 1000;
      pointer-events: none;
    }

    #status {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 460px;
      padding: 14px;
      background: rgba(0,0,0,.82);
      color: white;
      border-radius: 15px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      z-index: 1000;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="header">
    <h2>🌿 水上漂流記</h2>
    <p>第七組｜漂浮性水生植物：浮萍</p>
  </div>

  <div id="debug">
    系統初始化中……
  </div>

  <div id="status">
    正在啟動 AR，請允許相機權限
  </div>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./targets.mind;
                  autoStart: true;
                  uiLoading: yes;
                  uiScanning: no;
                  uiError: yes;"
    embedded
    renderer="colorManagement: true;
              antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-entity
      light="type: ambient;
             intensity: 1.5;
             color: #ffffff">
    </a-entity>

    <a-entity
      light="type: directional;
             intensity: 2;
             color: #ffffff"
      position="1 3 2">
    </a-entity>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="arTarget"
      mindar-image-target="targetIndex: 0">

      <a-entity
        id="modelWrapper">

        <a-entity
          id="duckweedModel"
          position="0 0 0"
          rotation="-90 0 0"
          scale="1 1 1">
        </a-entity>

      </a-entity>

    </a-entity>

  </a-scene>

  <script>
    const scene = document.getElementById("arScene");
    const target = document.getElementById("arTarget");
    const wrapper = document.getElementById("modelWrapper");
    const model = document.getElementById("duckweedModel");
    const debugBox = document.getElementById("debug");
    const statusBox = document.getElementById("status");

    let modelReady = false;
    let tracking = false;
    let arReady = false;
    let hasError = false;

    // 加上版本參數，避免舊 GLB 快取
    const modelURL =
      "./duckweed_ar.glb?v=final20261112";

    function debug(message) {
      debugBox.textContent = message;
      console.log("[第七組 AR]", message);
    }

    function updateStatus() {
      if (hasError) return;

      if (tracking && modelReady) {
        statusBox.textContent =
          "🌿 辨識成功！請觀察浮萍的葉狀體與水下細根";
      } else if (tracking) {
        statusBox.textContent =
          "圖卡辨識成功，正在等待模型載入";
      } else if (modelReady) {
        statusBox.textContent =
          "模型準備完成，請對準浮萍 AR 圖卡";
      } else if (arReady) {
        statusBox.textContent =
          "AR 已啟動，正在載入 3D 模型";
      } else {
        statusBox.textContent =
          "正在啟動 AR，請允許相機權限";
      }
    }

    function showError(message) {
      hasError = true;
      debug("❌ " + message);
      statusBox.textContent =
        "模型載入異常，請查看上方錯誤資訊";
    }

    // 先取得檔案，檢查 HTTP 狀態及 GLB 標頭
    async function loadModel() {
      try {
        debug("① 正在下載 duckweed_ar.glb");

        const response = await fetch(
          modelURL,
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error(
            "模型下載 HTTP " + response.status
          );
        }

        const buffer = await response.arrayBuffer();

        if (buffer.byteLength < 20) {
          throw new Error("模型檔案太小");
        }

        const bytes = new Uint8Array(buffer, 0, 4);
        const signature = String.fromCharCode(
          bytes[0], bytes[1], bytes[2], bytes[3]
        );

        if (signature !== "glTF") {
          throw new Error(
            "下載內容不是有效 GLB 標頭"
          );
        }

        debug(
          "② GLB 下載成功：" +
          (buffer.byteLength / 1024 / 1024).toFixed(2) +
          " MB，正在解析模型"
        );

        // 將已驗證的檔案交給 A-Frame 載入
        const blob = new Blob(
          [buffer],
          { type: "model/gltf-binary" }
        );

        const blobURL = URL.createObjectURL(blob);

        model.addEventListener(
          "model-loaded",
          () => {
            try {
              const mesh = model.getObject3D("mesh");

              if (!mesh) {
                throw new Error("GLB 沒有可用的網格");
              }

              // 先讓旋轉矩陣更新
              model.object3D.updateMatrixWorld(true);

              const box = new THREE.Box3()
                .setFromObject(mesh);

              if (box.isEmpty()) {
                throw new Error("模型邊界為空");
              }

              const size = new THREE.Vector3();
              const center = new THREE.Vector3();

              box.getSize(size);
              box.getCenter(center);

              const maxSize = Math.max(
                size.x, size.y, size.z
              );

              if (
                !Number.isFinite(maxSize) ||
                maxSize <= 0
              ) {
                throw new Error("模型尺寸不正確");
              }

              // 把模型最長邊調整到 0.8
              const factor = 0.8 / maxSize;

              wrapper.object3D.scale.setScalar(factor);

              // 把模型中心移到 AR 圖卡中心
              wrapper.object3D.position.set(
                -center.x * factor,
                -center.y * factor,
                -center.z * factor
              );

              modelReady = true;
              hasError = false;

              debug(
                "✅ 模型解析成功！尺寸：" +
                size.x.toFixed(2) + " × " +
                size.y.toFixed(2) + " × " +
                size.z.toFixed(2)
              );

              updateStatus();

            } catch (error) {
              showError(
                "模型定位失敗：" + error.message
              );
            } finally {
              URL.revokeObjectURL(blobURL);
            }
          },
          { once: true }
        );

        model.addEventListener(
          "model-error",
          (event) => {
            console.error("model-error", event.detail);
            showError(
              "GLB 解析失敗，請截圖並回報"
            );
            URL.revokeObjectURL(blobURL);
          },
          { once: true }
        );

        model.setAttribute(
          "gltf-model",
          blobURL
        );

      } catch (error) {
        console.error(error);
        showError(error.message);
      }
    }

    scene.addEventListener("arReady", () => {
      arReady = true;
      updateStatus();
    });

    scene.addEventListener("arError", () => {
      showError("AR 相機或辨識系統啟動失敗");
    });

    target.addEventListener("targetFound", () => {
      tracking = true;
      updateStatus();
    });

    target.addEventListener("targetLost", () => {
      tracking = false;
      updateStatus();
    });

    // 等待 A-Frame 場景完成初始化
    if (scene.hasLoaded) {
      loadModel();
    } else {
      scene.addEventListener(
        "loaded",
        loadModel,
        { once: true }
      );
    }

  </script>
</body>
</html>
