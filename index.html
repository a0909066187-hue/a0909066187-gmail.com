
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 user-scalable=no">

  <title>水上漂流記｜AR 測試</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: "Microsoft JhengHei", sans-serif;
    }

    /* AR 場景填滿螢幕 */
    a-scene {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
    }

    /* 讓 WebGL 畫布填滿場景 */
    a-scene canvas {
      width: 100% !important;
      height: 100% !important;
    }

    #title {
      position: fixed;
      z-index: 1000;
      top: 15px;
      left: 5%;
      width: 90%;
      box-sizing: border-box;
      padding: 15px;
      border-radius: 15px;
      background: rgba(255,255,255,0.92);
      color: #176c46;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      pointer-events: none;
    }

    #status {
      position: fixed;
      z-index: 1000;
      bottom: 35px;
      left: 5%;
      width: 90%;
      box-sizing: border-box;
      padding: 15px;
      border-radius: 15px;
      background: rgba(0,0,0,0.85);
      color: white;
      text-align: center;
      font-size: 15px;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="title">
    🌿 水上漂流記｜AR 測試
  </div>

  <div id="status">
    正在啟動 AR 相機……
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: no;
      uiError: yes;
    "
    color-space="sRGB"
    renderer="colorManagement: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
    </a-assets>

    <!-- AR 相機 -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- 圖卡辨識 -->
    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">

      <!-- 粉紅色測試方塊 -->
      <a-box
        position="0 0 0.2"
        rotation="0 30 0"
        width="0.35"
        height="0.35"
        depth="0.35"
        material="
          color: #ff1493;
          shader: flat;
          side: double;
          opacity: 1;
        ">
      </a-box>

      <!-- 黃色測試球 -->
      <a-sphere
        position="0.4 0 0.15"
        radius="0.12"
        material="
          color: #ffff00;
          shader: flat;
        ">
      </a-sphere>

      <!-- 藍色定位平面 -->
      <a-plane
        position="0 0 -0.01"
        width="0.9"
        height="0.9"
        material="
          color: #00bfff;
          opacity: 0.35;
          transparent: true;
          side: double;
        ">
      </a-plane>

    </a-entity>

  </a-scene>

  <script>
    const status =
      document.getElementById("status");

    const scene =
      document.querySelector("a-scene");

    const target =
      document.getElementById("target");

    scene.addEventListener("arReady", () => {
      status.textContent =
        "✅ AR 已啟動，請對準浮萍圖卡";
    });

    scene.addEventListener("arError", () => {
      status.textContent =
        "❌ AR 啟動失敗，請檢查相機權限";
    });

    target.addEventListener("targetFound", () => {
      status.textContent =
        "✅ 已辨識圖卡！應出現粉紅方塊、黃色球與藍色平面";
    });

    target.addEventListener("targetLost", () => {
      status.textContent =
        "請重新對準浮萍圖卡";
    });
  </script>

</body>
</html>
