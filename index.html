
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 user-scalable=no">

  <title>水上漂流記｜浮萍 AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Microsoft JhengHei",
                   "Noto Sans TC", sans-serif;
    }

    a-scene {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      background: transparent !important;
    }

    #header {
      position: fixed;
      z-index: 1000;
      top: 12px;
      left: 5%;
      width: 90%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.92);
      text-align: center;
      pointer-events: none;
    }

    #header h2 {
      margin: 0;
      color: #18794e;
      font-size: 22px;
    }

    #header p {
      margin: 6px 0 0;
      color: #52645b;
      font-size: 13px;
    }

    #status {
      position: fixed;
      z-index: 1000;
      bottom: 30px;
      left: 5%;
      width: 90%;
      box-sizing: border-box;
      padding: 15px;
      border-radius: 15px;
      background: rgba(0,0,0,0.82);
      color: white;
      font-size: 15px;
      text-align: center;
      line-height: 1.5;
      pointer-events: none;
    }

    #debug {
      position: fixed;
      z-index: 1000;
      top: 110px;
      left: 5%;
      width: 90%;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.92);
      color: #176c46;
      font-size: 13px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="header">
    <h2>🌿 水上漂流記</h2>
    <p>第七組｜漂浮性水生植物：浮萍</p>
  </div>

  <div id="debug">
    正在準備 3D 浮萍模型……
  </div>

  <div id="status">
    請允許相機權限
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: no;
      uiError: yes;
    "
    embedded
    color-space="sRGB"
    renderer="
      colorManagement: true;
      antialias: true;
      alpha: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- 預先載入浮萍 GLB -->
    <a-assets timeout="60000">
      <a-asset-item
        id="duckweedAsset"
        src="./duckweed_ar.glb">
      </a-asset-item>
    </a-assets>

    <!-- AR 相機 -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- 補光 -->
    <a-entity
      light="
        type: ambient;
        color: #ffffff;
        intensity: 1.8;
      ">
    </a-entity>

    <a-entity
      light="
        type: directional;
        color: #ffffff;
        intensity: 2;
      "
      position="1 2 3">
    </a-entity>

    <!-- 浮萍圖卡辨識 -->
    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">

      <!-- 浮萍模型 -->
      <a-gltf-model
        id="duckweedModel"
        src="#duckweedAsset"
        position="0 0 0.15"
        rotation="90 0 0"
        scale="0.35 0.35 0.35"
        visible="true">
      </a-gltf-model>

      <!-- 小型定位標記：測試完成後可移除 -->
      <a-sphere
        id="marker"
        position="0.45 0 0.12"
        radius="0.055"
        material="
          color: #ff1493;
          shader: flat;
        ">
      </a-sphere>

    </a-entity>

  </a-scene>

  <script>
    const status =
      document.getElementById("status");

    const debug =
      document.getElementById("debug");

    const scene =
      document.querySelector("a-scene");

    const target =
      document.getElementById("target");

    const model =
      document.getElementById("duckweedModel");

    let modelReady = false;
    let tracking = false;

    function updateStatus() {
      if (tracking && modelReady) {
        status.textContent =
          "🌿 辨識成功！請觀察浮萍的葉狀體與細根";
      } else if (tracking) {
        status.textContent =
          "已辨識圖卡，正在等待浮萍模型";
      } else if (modelReady) {
        status.textContent =
          "模型已準備完成，請對準浮萍圖卡";
      }
    }

    model.addEventListener(
      "model-loaded",
      function () {
        modelReady = true;

        debug.textContent =
          "✅ 浮萍 GLB 已載入";

        updateStatus();
      }
    );

    model.addEventListener(
      "model-error",
      function (event) {
        const error =
          event.detail &&
          event.detail.message
            ? event.detail.message
            : "未知錯誤";

        debug.textContent =
          "❌ 模型載入失敗：" + error;
      }
    );

    scene.addEventListener(
      "arReady",
      function () {
        status.textContent =
          "AR 相機已啟動，請對準浮萍圖卡";
      }
    );

    scene.addEventListener(
      "arError",
      function () {
        status.textContent =
          "❌ AR 啟動失敗，請檢查相機權限";
      }
    );

    target.addEventListener(
      "targetFound",
      function () {
        tracking = true;
        updateStatus();
      }
    );

    target.addEventListener(
      "targetLost",
      function () {
        tracking = false;
        updateStatus();
      }
    );
  </script>

</body>
</html>
